upstream app_server {
    server app:8000;
}

upstream frontend_server {
    server frontend:80;
}

server {
    listen 80;
    server_name localhost;
    client_max_body_size 2G;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Frontend
    location / {
        proxy_pass http://frontend_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API
    location /api/ {
        proxy_pass http://app_server/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend docs
    location /docs {
        proxy_pass http://app_server/docs;
        proxy_set_header Host $host;
    }

    location /redoc {
        proxy_pass http://app_server/redoc;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://app_server/openapi.json;
        proxy_set_header Host $host;
    }

    # Socket.IO WebSocket
    location /socket.io/ {
        proxy_pass http://app_server/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Health check
    location /health {
        proxy_pass http://app_server/api/v1/health;
        access_log off;
    }

    # Flower monitoring (restrict to admin IPs in production)
    location /flower/ {
        proxy_pass http://app_server/flower/;
        proxy_set_header Host $host;
        auth_basic "Flower Monitoring";
        auth_basic_user_file /etc/nginx/.htpasswd;
    }
}
