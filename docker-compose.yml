version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lipread-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage
      - ./models:/app/models
    networks:
      - lipread-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G

  postgres:
    image: postgres:16-alpine
    container_name: lipread-postgres
    environment:
      POSTGRES_DB: lipread_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lipread-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  redis:
    image: redis:7-alpine
    container_name: lipread-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - lipread-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lipread-celery-worker
    command: celery -A app.tasks.celery_app worker -l info -Q transcription -c 4
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage
      - ./models:/app/models
    networks:
      - lipread-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lipread-celery-beat
    command: celery -A app.tasks.celery_app beat -l info
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - lipread-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  lipread-network:
    driver: bridge
