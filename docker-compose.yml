services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lipread-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage
      - ./models:/app/models
    networks:
      - lipread-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lipread-frontend
    ports:
      - "80:80"
    networks:
      - lipread-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: lipread-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
      - frontend
    networks:
      - lipread-network
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: lipread-postgres
    environment:
      POSTGRES_DB: lipread_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lipread-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  redis:
    image: redis:7-alpine
    container_name: lipread-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - lipread-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lipread-celery-worker
    command: celery -A app.tasks.celery_app worker -l info -Q transcription,default -c 4
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage
      - ./models:/app/models
    networks:
      - lipread-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G

  celery-audio-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lipread-celery-audio-worker
    command: celery -A app.tasks.celery_app worker -l info -Q audio -c 2
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage
      - ./models:/app/models
    networks:
      - lipread-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lipread-celery-beat
    command: celery -A app.tasks.celery_app beat -l info
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - lipread-network
    restart: unless-stopped

  flower:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lipread-flower
    command: celery -A app.tasks.celery_app flower --port=5555 --basic_auth=*
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "5555:5555"
    networks:
      - lipread-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  lipread-network:
    driver: bridge
